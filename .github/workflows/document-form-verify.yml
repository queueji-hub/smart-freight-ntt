name: Document Form Verification

on:
  push:
    branches:
      - feature/phase30-preview

jobs:
  verify-document-contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile changed document/UI sources
        run: python -m py_compile views/bl_v2_view.py views/finance_document_workspace.py pdf/bl_document_renderer.py pdf/invoice_pdf.py tests/test_document_form_contract.py
      - name: Run document contract tests
        run: pytest -q tests/test_document_form_contract.py
