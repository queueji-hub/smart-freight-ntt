name: Phase 30 Verification

on:
  push:
    branches:
      - feature/phase30-preview
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile Python source
        run: python -m compileall -q managers views database pdf core tests Dashboard.py
      - name: Verify Phase 30 imports
        run: |
          python - <<'PY'
          import managers.document_duplicate_service
          import managers.document_approval_manager
          import managers.master_data_manager
          import views.billing_view
          import views.bl_view
          import core.freight_rules
          print("Phase 30 imports: PASS")
          PY
      - name: Test canonical freight rules
        run: pytest -q tests/test_freight_rules.py
